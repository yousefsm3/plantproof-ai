<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="PlantProof AI mark">
  <!-- Original PlantProof AI mark: a minimal neural node network (AI) on a petrol-green tile -->
  <defs>
    <linearGradient id="pp-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1E6B64"/>
      <stop offset="1" stop-color="#0B2E2D"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#pp-bg)"/>
  <g stroke="#DCEBE8" stroke-width="2.4" stroke-linecap="round" stroke-opacity="0.85">
    <line x1="32" y1="32" x2="32" y2="15"/>
    <line x1="32" y1="32" x2="17.5" y2="41"/>
    <line x1="32" y1="32" x2="46.5" y2="41"/>
    <line x1="32" y1="15" x2="17.5" y2="41" stroke-opacity="0.35"/>
    <line x1="32" y1="15" x2="46.5" y2="41" stroke-opacity="0.35"/>
    <line x1="17.5" y1="41" x2="46.5" y2="41" stroke-opacity="0.35"/>
  </g>
  <circle cx="32" cy="15" r="4.6" fill="#FFFFFF"/>
  <circle cx="17.5" cy="41" r="4.6" fill="#FFFFFF"/>
  <circle cx="46.5" cy="41" r="4.6" fill="#FFFFFF"/>
  <circle cx="32" cy="32" r="6.6" fill="#C8844A"/>
  <circle cx="32" cy="32" r="2.6" fill="#0B2E2D"/>
</svg>
